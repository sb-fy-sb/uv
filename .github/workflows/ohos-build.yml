# uv OHOS Build CI
#
# Cross-compile uv for HarmonyOS (OHOS) aarch64 from a Windows x86_64 host.
# Uses the OHOS SDK (LLVM + musl sysroot) for cross-compilation.
#
# Branch model:
#   ohos-aarch64    — CI builds: verify compilation, upload Artifacts (30 days)
#   ohos-release    — Release builds: CI + upload to GitHub Release (versioned + rolling)
#   claude/ohos-*   — Development builds: CI only
#
# Required runner environment:
#   - Windows x86_64
#   - OHOS SDK at C:\ohos\sdk (LLVM toolchain + musl sysroot)
#   - Rust toolchain with aarch64-unknown-linux-ohos target

name: OHOS Build

on:
  push:
    branches:
      - ohos-aarch64
      - ohos-release
      - claude/ohos-*
    paths:
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ohos-build.yml'
      - 'ohos/install-uv-ohos.sh'
  workflow_dispatch:

concurrency:
  group: ohos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OHOS_SDK: C:\ohos\sdk
  CARGO_INCREMENTAL: 1
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    name: Build uv for OHOS (aarch64)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 300

    steps:
      # ============================================================
      # 1. Source checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Environment
      # ============================================================
      - name: Verify runner environment
        shell: powershell
        run: |
          $sdk = $env:OHOS_SDK
          Write-Host "=== Checking OHOS SDK ==="
          if (-not (Test-Path "$sdk\llvm\bin\clang.exe")) { throw "clang.exe not found at $sdk\llvm\bin\" }
          if (-not (Test-Path "$sdk\sysroot")) { throw "sysroot not found at $sdk\sysroot" }
          Write-Host "OK OHOS SDK: $sdk"

          Write-Host "=== Checking Rust ==="
          $rustVer = & rustc --version 2>&1; Write-Host $rustVer
          $cargoVer = & cargo --version 2>&1; Write-Host $cargoVer
          $targets = & rustc --print target-list 2>&1
          if ($targets -notcontains "aarch64-unknown-linux-ohos") {
            throw "aarch64-unknown-linux-ohos target not supported"
          }
          Write-Host "OK Rust target: aarch64-unknown-linux-ohos"

          Write-Host "=== Checking build tools ==="
          try { $cmakeVer = & cmake --version 2>&1 | Select-Object -First 1; Write-Host $cmakeVer } catch { Write-Host "WARN cmake not in PATH" }
          try { $ninjaVer = & ninja --version 2>&1; Write-Host $ninjaVer } catch { Write-Host "WARN ninja not in PATH" }

      - name: Setup OHOS cross-compilation environment
        shell: powershell
        run: |
          $sdk = $env:OHOS_SDK -replace '\\','/'
          $sysroot = "$sdk/sysroot"
          $llvm = "$sdk/llvm/bin"
          $target = "aarch64-linux-ohos"

          # Set env vars (override .cargo/config.toml device paths)
          "OHOS_SYSROOT=$sysroot" >> $env:GITHUB_ENV
          "CC_aarch64_unknown_linux_ohos=$llvm/clang.exe" >> $env:GITHUB_ENV
          "CFLAGS_aarch64_unknown_linux_ohos=--target=$target --sysroot=$sysroot -D__MUSL__" >> $env:GITHUB_ENV
          "CXX_aarch64_unknown_linux_ohos=$llvm/clang++.exe" >> $env:GITHUB_ENV
          "CXXFLAGS_aarch64_unknown_linux_ohos=--target=$target --sysroot=$sysroot -D__MUSL__" >> $env:GITHUB_ENV
          "AR_aarch64_unknown_linux_ohos=$llvm/llvm-ar.exe" >> $env:GITHUB_ENV
          "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$llvm/clang.exe" >> $env:GITHUB_ENV
          "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUSTFLAGS=-C link-arg=--target=$target -C link-arg=--sysroot=$sysroot" >> $env:GITHUB_ENV
          "AWS_LC_SYS_CMAKE_AR=$llvm/llvm-ar.exe" >> $env:GITHUB_ENV
          "AWS_LC_SYS_CMAKE_RANLIB=$llvm/llvm-ranlib.exe" >> $env:GITHUB_ENV

          # Use Windows-compatible cmake toolchain (not device-native)
          "CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_ohos=$env:GITHUB_WORKSPACE\ohos-windows-toolchain.cmake" >> $env:GITHUB_ENV

          # CMake generator: must be Ninja (not Visual Studio) for clang cross-compilation
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_MAKE_PROGRAM=$env:OHOS_SDK\build-tools\cmake\bin\ninja.exe" >> $env:GITHUB_ENV

          # Add OHOS SDK cmake/ninja to PATH
          "$env:OHOS_SDK\build-tools\cmake\bin" >> $env:GITHUB_PATH

          Write-Host "OK Environment configured"
          Write-Host "   Sysroot: $sysroot"
          Write-Host "   LLVM:    $llvm"

      # ============================================================
      # 3. Caching
      # ============================================================
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ohos-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ohos-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ohos-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ohos-cargo-target-

      # ============================================================
      # 4. Build
      # ============================================================
      - name: Build uv
        shell: powershell
        run: |
          # Rename config.toml to avoid device-native rustflags merging with CI env vars.
          # The [target.aarch64-unknown-linux-ohos] rustflags in config.toml contain
          # OHOS device paths that conflict with the Windows CI paths set via env vars.
          # CARGO_TARGET_*_RUSTFLAGS env vars are merged (not replaced) with config.toml.
          $configPath = Join-Path (Join-Path $env:GITHUB_WORKSPACE ".cargo") "config.toml"
          $configBak  = Join-Path (Join-Path $env:GITHUB_WORKSPACE ".cargo") "config.toml.ci-bak"
          if (Test-Path $configPath) {
            Move-Item -Force $configPath $configBak
            Write-Host "Moved config.toml aside to avoid device path conflicts"
          }
          try {
            & cargo build --release --target aarch64-unknown-linux-ohos -p uv
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
          } finally {
            if (Test-Path $configBak) {
              Move-Item -Force $configBak $configPath
              Write-Host "Restored config.toml"
            }
          }

      # ============================================================
      # 5. Verify binary
      # ============================================================
      - name: Verify binary
        shell: powershell
        run: |
          $bin = "target/aarch64-unknown-linux-ohos/release/uv"
          $sdk = $env:OHOS_SDK
          $readelf = "$sdk\llvm\bin\llvm-readelf.exe"

          Write-Host "=== File info ==="
          Get-Item $bin | Select-Object Name, Length, LastWriteTime | Format-List

          Write-Host "=== ELF header ==="
          $header = & $readelf -h $bin 2>&1
          $header | Select-String "Class|Machine|OS/ABI"
          if (-not ($header | Select-String "AArch64")) { throw "Not an AArch64 ELF binary" }
          Write-Host "OK Valid AArch64 ELF"

          Write-Host ""
          Write-Host "=== Dynamic dependencies ==="
          $dynamic = & $readelf -d $bin 2>&1
          $needed = $dynamic | Select-String "NEEDED" | ForEach-Object { $_ -replace '.*\[(.*)\].*','$1' }
          Write-Host "NEEDED: $needed"
          foreach ($lib in $needed) {
            if ($lib -eq "libc.so") {
              Write-Host "OK Expected: $lib"
            } else {
              $dynamic | Select-String "NEEDED"
              throw "Unexpected dynamic dependency: $lib"
            }
          }
          Write-Host "OK Binary validation passed"

      # ============================================================
      # 6. Package & upload
      # ============================================================
      - name: Package binary
        id: package
        shell: powershell
        run: |
          $bin = "target/aarch64-unknown-linux-ohos/release/uv"
          $commit = & git rev-parse --short HEAD
          $date = Get-Date -Format "yyyyMMdd_HHmmss"
          $name = "uv-ohos-aarch64-$commit-$date"

          $releaseDir = "$env:TEMP\uv-release\$name"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item $bin "$releaseDir\uv"

          @"
          # uv for HarmonyOS (OHOS) aarch64

          Cross-compiled from Windows for OpenHarmony/HarmonyOS NEXT (aarch64).

          ## Usage

          Copy the uv binary to your OHOS device via hdc:

              hdc file send uv /data/local/tmp/uv
              hdc shell chmod +x /data/local/tmp/uv
              hdc shell /data/local/tmp/uv --version
          "@ | Set-Content "$releaseDir\README.md"

          Set-Location "$env:TEMP\uv-release"
          & tar czf "$name.tar.gz" $name

          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$env:TEMP\uv-release\$name.tar.gz" >> $env:GITHUB_OUTPUT
          Write-Host "OK Packaged: $name.tar.gz"

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 30

      - name: Upload artifact (raw binary)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-raw
          path: target/aarch64-unknown-linux-ohos/release/uv
          retention-days: 30

      # ============================================================
      # 7. GitHub Release (only on ohos-release branch)
      # ============================================================
      - name: Prepare release assets
        if: github.ref_name == 'ohos-release'
        id: release
        shell: powershell
        run: |
          $releaseAssets = "$env:TEMP\uv-release-assets"
          New-Item -ItemType Directory -Path $releaseAssets -Force | Out-Null

          # Versioned tag: ohos-YYYYMMDD
          $date = Get-Date -Format "yyyyMMdd"
          $versionedTag = "ohos-$date"
          $commit = & git rev-parse --short HEAD

          Copy-Item "target/aarch64-unknown-linux-ohos/release/uv" "$releaseAssets\uv-ohos-aarch64"
          Copy-Item "ohos/install-uv-ohos.sh" "$releaseAssets\install-uv-ohos.sh"

          "assets=$releaseAssets" >> $env:GITHUB_ENV
          "versioned_tag=$versionedTag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          Write-Host "OK Release assets prepared, tag: $versionedTag"

      - name: Upload versioned release
        if: github.ref_name == 'ohos-release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.versioned_tag }}
          name: "OHOS aarch64 ${{ steps.release.outputs.versioned_tag }}"
          body: |
            uv for OpenHarmony / HarmonyOS NEXT (aarch64).

            **Commit**: `${{ github.sha }}` (`${{ steps.release.outputs.commit }}`)
            **Build**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ## 安装

            ```sh
            curl -fSL -o /data/local/tmp/uv https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.versioned_tag }}/uv-ohos-aarch64
            chmod +x /data/local/tmp/uv
            /data/local/tmp/uv --version
            ```
          files: |
            ${{ env.assets }}/uv-ohos-aarch64
            ${{ env.assets }}/install-uv-ohos.sh
          fail_on_unmatched_files: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old ohos-latest assets
        if: github.ref_name == 'ohos-release'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            $existing = & gh release view ohos-latest --json assets --jq ".assets[].name" 2>&1
            if ($LASTEXITCODE -eq 0 -and $existing) {
              Write-Host "Removing old ohos-latest assets..."
              $existing -split "`n" | ForEach-Object {
                $asset = $_.Trim()
                if ($asset) {
                  & gh release delete-asset ohos-latest $asset --yes 2>&1 | Out-Null
                }
              }
              Write-Host "OK Old assets removed"
            }
          } catch {
            Write-Host "WARN Could not clean old assets: $_"
          }

      - name: Update ohos-latest (rolling tag for one-click install)
        if: github.ref_name == 'ohos-release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ohos-latest
          name: "OHOS aarch64 (latest)"
          body: |
            Rolling release — always points to the newest OHOS build.

            **Version**: `${{ steps.release.outputs.versioned_tag }}`
            **Commit**: `${{ github.sha }}`
            **Build**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ## 一键安装

            ```sh
            /bin/sh -c "$(curl -fsSL https://github.com/${{ github.repository }}/releases/download/ohos-latest/install-uv-ohos.sh)"
            ```

            ## 手动下载

            ```sh
            curl -fSL -o /data/local/tmp/uv https://github.com/${{ github.repository }}/releases/download/ohos-latest/uv-ohos-aarch64
            chmod +x /data/local/tmp/uv
            /data/local/tmp/uv --version
            ```
          files: |
            ${{ env.assets }}/uv-ohos-aarch64
            ${{ env.assets }}/install-uv-ohos.sh
          fail_on_unmatched_files: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
