# uv OHOS Build CI
#
# Cross-compile uv for HarmonyOS (OHOS) aarch64 from a Windows x86_64 host.
# Uses the OHOS SDK (LLVM + musl sysroot) for cross-compilation.
#
# Required runner environment:
#   - Windows x86_64 with Git Bash
#   - OHOS SDK at C:\ohos\sdk (LLVM toolchain + musl sysroot)
#   - Rust toolchain with aarch64-unknown-linux-ohos target
#   - cmake, ninja in PATH (or from OHOS SDK build-tools)

name: OHOS Build

on:
  push:
    branches:
      - ohos-aarch64
      - claude/ohos-*
    paths:
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ohos-build.yml'
  workflow_dispatch:

concurrency:
  group: ohos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OHOS_SDK: C:/ohos/sdk
  CARGO_INCREMENTAL: 1
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    name: Build uv for OHOS (aarch64)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 300
    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 1. Source checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Environment
      # ============================================================
      - name: Verify runner environment
        run: |
          echo "=== Checking OHOS SDK ==="
          test -d "$OHOS_SDK" || { echo "❌ OHOS SDK not found at $OHOS_SDK"; exit 1; }
          test -x "$OHOS_SDK/llvm/bin/clang.exe" || { echo "❌ clang.exe not found"; exit 1; }
          test -d "$OHOS_SDK/sysroot" || { echo "❌ sysroot not found"; exit 1; }
          echo "✅ OHOS SDK: $OHOS_SDK"

          echo "=== Checking Rust ==="
          rustc --version
          cargo --version
          rustc --print target-list | grep -q aarch64-unknown-linux-ohos || \
            { echo "❌ aarch64-unknown-linux-ohos target not supported"; exit 1; }
          echo "✅ Rust target: aarch64-unknown-linux-ohos"

          echo "=== Checking build tools ==="
          cmake --version | head -1 || echo "⚠️  cmake not found in PATH"
          ninja --version || echo "⚠️  ninja not found in PATH"
          "$OHOS_SDK/llvm/bin/llvm-readelf.exe" --version 2>/dev/null | head -1 || echo "⚠️  llvm-readelf not found"

      - name: Setup OHOS cross-compilation environment
        run: |
          SYSROOT="$OHOS_SDK/sysroot"
          LLVM="$OHOS_SDK/llvm/bin"

          echo "OHOS_SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_ohos=$LLVM/clang.exe" >> $GITHUB_ENV
          echo "CFLAGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$SYSROOT -D__MUSL__" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_ohos=$LLVM/clang++.exe" >> $GITHUB_ENV
          echo "CXXFLAGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$SYSROOT -D__MUSL__" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_ohos=$LLVM/llvm-ar.exe" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$LLVM/clang.exe" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUSTFLAGS=-C link-arg=--target=aarch64-linux-ohos -C link-arg=--sysroot=$SYSROOT" >> $GITHUB_ENV
          echo "AWS_LC_SYS_CMAKE_AR=$LLVM/llvm-ar.exe" >> $GITHUB_ENV
          echo "AWS_LC_SYS_CMAKE_RANLIB=$LLVM/llvm-ranlib.exe" >> $GITHUB_ENV

          # Add OHOS SDK tools to PATH (cmake, ninja)
          echo "$OHOS_SDK/build-tools/cmake/bin" >> $GITHUB_PATH

          echo "✅ Environment configured"
          echo "   Sysroot: $SYSROOT"
          echo "   LLVM:    $LLVM"

      # ============================================================
      # 3. Caching
      # ============================================================
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ohos-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ohos-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ohos-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ohos-cargo-target-

      # ============================================================
      # 4. Build
      # ============================================================
      - name: Build uv
        run: cargo build --release --target aarch64-unknown-linux-ohos -p uv

      # ============================================================
      # 5. Verify binary
      # ============================================================
      - name: Verify binary
        run: |
          BIN="target/aarch64-unknown-linux-ohos/release/uv"
          READELF="$OHOS_SDK/llvm/bin/llvm-readelf.exe"

          echo "=== File info ==="
          ls -lh "$BIN"
          file "$BIN" 2>/dev/null || echo "(file command not available)"

          echo ""
          echo "=== ELF header ==="
          "$READELF" -h "$BIN" | grep -E "Class|Machine|OS/ABI" || {
            echo "❌ Failed to read ELF header"
            exit 1
          }
          "$READELF" -h "$BIN" | grep -q "AArch64" || {
            echo "❌ Not an AArch64 ELF binary"
            exit 1
          }
          echo "✅ Valid AArch64 ELF"

          echo ""
          echo "=== Dynamic dependencies ==="
          NEEDED=$("$READELF" -d "$BIN" | grep "NEEDED" | sed 's/.*\[//;s/\]//')
          echo "NEEDED: $NEEDED"
          for lib in $NEEDED; do
            case "$lib" in
              libc.so) echo "✅ Expected: $lib" ;;
              *)
                echo "❌ Unexpected dynamic dependency: $lib"
                "$READELF" -d "$BIN" | grep "NEEDED"
                exit 1
                ;;
            esac
          done
          echo "✅ Binary validation passed"

      # ============================================================
      # 6. Package & upload
      # ============================================================
      - name: Package binary
        id: package
        run: |
          BIN="target/aarch64-unknown-linux-ohos/release/uv"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d_%H%M%S)
          NAME="uv-ohos-aarch64-${COMMIT}-${DATE}"

          mkdir -p /tmp/uv-release/${NAME}
          cp "$BIN" /tmp/uv-release/${NAME}/uv

          cat > /tmp/uv-release/${NAME}/README.md << 'EOF'
          # uv for HarmonyOS (OHOS) aarch64

          Cross-compiled from Windows for OpenHarmony/HarmonyOS NEXT (aarch64).

          ## Usage

          Copy the `uv` binary to your OHOS device via hdc:

              hdc file send uv /data/local/tmp/uv
              hdc shell chmod +x /data/local/tmp/uv
              hdc shell /data/local/tmp/uv --version
          EOF

          cd /tmp/uv-release
          tar czf ${NAME}.tar.gz ${NAME}/

          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "path=/tmp/uv-release/${NAME}.tar.gz" >> $GITHUB_OUTPUT
          echo "✅ Packaged: ${NAME}.tar.gz"

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 30

      - name: Upload artifact (raw binary)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-raw
          path: target/aarch64-unknown-linux-ohos/release/uv
          retention-days: 30
